<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fuel the Fun</title>
<style>
  :root {
    --bg: #FAF6ED;
    --card: #FFFDF8;
    --text: #183F35;
    --sage: #E4EAD9;
    --terracotta: #BE7050;
    --peach: #F8E3D1;
    --blue: #E2ECEE;
    --gold: #F8E8C7;
    --danger: #a3432f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 24px 16px 100px;
  }
  h1, h2, h3 {
    font-family: Georgia, "Times New Roman", serif;
    margin: 0 0 8px;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(24, 63, 53, 0.06);
  }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 999px;
    background: var(--sage);
    cursor: pointer;
    font-weight: 600;
  }
  .tab.active { background: var(--terracotta); color: #fff; }
  label { display: block; font-size: 0.85rem; margin: 12px 0 4px; font-weight: 600; }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid #ddd3c0;
    background: #fff;
    font-size: 1rem;
  }
  button {
    background: var(--terracotta);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 12px 20px;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 16px;
    width: 100%;
  }
  button.secondary { background: var(--sage); color: var(--text); }
  button.small { width: auto; padding: 6px 14px; margin-top: 0; font-size: 0.85rem; }
  .error { color: var(--danger); font-size: 0.9rem; margin-top: 8px; }
  .member-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px; border-radius: 14px; background: #fff; margin-bottom: 8px;
  }
  .member-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 10px; }
  .pill {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    background: var(--gold); font-size: 0.75rem; margin-left: 8px;
  }
  .event-row { padding: 10px 0; border-bottom: 1px solid #eee3cf; }
  .event-row:last-child { border-bottom: none; }
  .muted { opacity: 0.65; font-size: 0.85rem; }
  .hidden { display: none !important; }
  .join-code { font-size: 1.4rem; font-weight: 700; letter-spacing: 2px; background: var(--gold); padding: 10px 16px; border-radius: 12px; text-align: center; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .top-bar button { width: auto; margin: 0; }
</style>
</head>
<body>
<div class="wrap">

  <!-- AUTH SCREEN -->
  <div id="authScreen">
    <h1>Fuel the Fun 🌱</h1>
    <div class="tabs">
      <div class="tab active" id="tabLogin">Log in</div>
      <div class="tab" id="tabSignup">Start a family</div>
    </div>

    <div class="card" id="loginCard">
      <h2>Welcome back</h2>
      <label>Family join code</label>
      <input id="loginJoinCode" placeholder="e.g. AB12CD" maxlength="6" style="text-transform:uppercase" />
      <label>PIN</label>
      <input id="loginPin" type="password" inputmode="numeric" placeholder="4-12 digits" />
      <button id="loginBtn">Log in</button>
      <div class="error hidden" id="loginError"></div>
    </div>

    <div class="card hidden" id="signupCard">
      <h2>Start your family</h2>
      <label>Family name</label>
      <input id="signupFamilyName" placeholder="e.g. The Smiths" />
      <label>Your name</label>
      <input id="signupMemberName" placeholder="e.g. Maddie" />
      <label>I am a...</label>
      <select id="signupRole">
        <option value="parent">Parent</option>
        <option value="child">Child</option>
      </select>
      <label>Choose a PIN (4-12 digits)</label>
      <input id="signupPin" type="password" inputmode="numeric" placeholder="e.g. 1234" />
      <button id="signupBtn">Create our family</button>
      <div class="error hidden" id="signupError"></div>
    </div>
  </div>

  <!-- HOME SCREEN -->
  <div id="homeScreen" class="hidden">
    <div class="top-bar">
      <h1 id="familyNameHeading">Fuel the Fun 🌱</h1>
      <button class="secondary small" id="logoutBtn">Log out</button>
    </div>

    <div class="card">
      <h3>Your family's join code</h3>
      <p class="muted">Share this so other family members can log in from their own device.</p>
      <div class="join-code" id="joinCodeDisplay">------</div>
    </div>

    <div class="card">
      <h3>Family members</h3>
      <div id="membersList"></div>
      <button class="secondary" id="showAddMemberBtn">+ Add a family member</button>
      <div id="addMemberForm" class="hidden" style="margin-top: 12px;">
        <label>Name</label>
        <input id="newMemberName" placeholder="e.g. Jamie" />
        <label>Role</label>
        <select id="newMemberRole">
          <option value="child">Child</option>
          <option value="parent">Parent</option>
        </select>
        <button id="addMemberBtn">Add</button>
      </div>
      <div class="error hidden" id="memberError"></div>
    </div>

    <div class="card">
      <h3>Shared calendar</h3>
      <div id="eventsList"></div>
      <button class="secondary" id="showAddEventBtn">+ Add an event</button>
      <div id="addEventForm" class="hidden" style="margin-top: 12px;">
        <label>Title</label>
        <input id="newEventTitle" placeholder="e.g. Bike ride in the park" />
        <label>For</label>
        <select id="newEventMember"></select>
        <label>Pillar</label>
        <select id="newEventPillar">
          <option value="">None</option>
          <option value="fuel">Fuel</option>
          <option value="move">Move</option>
          <option value="grow">Grow</option>
        </select>
        <label>When</label>
        <input id="newEventStart" type="datetime-local" />
        <button id="addEventBtn">Add event</button>
      </div>
      <div class="error hidden" id="eventError"></div>
    </div>
  </div>

</div>

<script>
const API = "";
let state = { token: localStorage.getItem("ftf_token") || null, family: null, members: [] };

function $(id) { return document.getElementById(id); }
function show(id) { $(id).classList.remove("hidden"); }
function hide(id) { $(id).classList.add("hidden"); }
function showError(id, msg) { $(id).textContent = msg; show(id); }
function clearError(id) { hide(id); $(id).textContent = ""; }

async function api(path, options = {}) {
  const headers = options.headers || {};
  headers["Content-Type"] = "application/json";
  if (state.token) headers["Authorization"] = "Bearer " + state.token;
  const res = await fetch(API + path, { ...options, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.ok === false) {
    throw new Error(data.error || ("Request failed (" + res.status + ")"));
  }
  return data;
}

// --- Tabs ---
$("tabLogin").onclick = () => {
  $("tabLogin").classList.add("active");
  $("tabSignup").classList.remove("active");
  show("loginCard"); hide("signupCard");
};
$("tabSignup").onclick = () => {
  $("tabSignup").classList.add("active");
  $("tabLogin").classList.remove("active");
  show("signupCard"); hide("loginCard");
};

// --- Signup ---
$("signupBtn").onclick = async () => {
  clearError("signupError");
  try {
    const data = await api("/api/family/signup", {
      method: "POST",
      body: JSON.stringify({
        familyName: $("signupFamilyName").value,
        firstMemberName: $("signupMemberName").value,
        firstMemberRole: $("signupRole").value,
        pin: $("signupPin").value,
      }),
    });
    state.token = data.token;
    localStorage.setItem("ftf_token", data.token);
    await loadHome();
  } catch (err) {
    showError("signupError", err.message);
  }
};

// --- Login ---
$("loginBtn").onclick = async () => {
  clearError("loginError");
  try {
    const data = await api("/api/family/login", {
      method: "POST",
      body: JSON.stringify({
        joinCode: $("loginJoinCode").value,
        pin: $("loginPin").value,
      }),
    });
    state.token = data.token;
    localStorage.setItem("ftf_token", data.token);
    await loadHome();
  } catch (err) {
    showError("loginError", err.message);
  }
};

$("logoutBtn").onclick = () => {
  localStorage.removeItem("ftf_token");
  state.token = null;
  hide("homeScreen");
  show("authScreen");
};

// --- Home ---
async function loadHome() {
  const me = await api("/api/me");
  state.family = me.family;
  state.members = me.members;

  hide("authScreen");
  show("homeScreen");

  $("familyNameHeading").textContent = me.family.name + " 🌱";
  $("joinCodeDisplay").textContent = me.family.joinCode;

  renderMembers();
  await renderEvents();
}

function renderMembers() {
  const list = $("membersList");
  list.innerHTML = "";
  const memberSelect = $("newEventMember");
  memberSelect.innerHTML = "";

  state.members.forEach((m) => {
    const row = document.createElement("div");
    row.className = "member-row";
    row.innerHTML = `
      <span><span class="member-dot" style="background:${m.color || '#ccc'}"></span>${m.display_name}<span class="pill">${m.role}</span></span>
      <span>
        <span id="stars-${m.id}" class="muted">⭐ ...</span>
        <button class="small" data-member="${m.id}">Give a star</button>
      </span>
    `;
    list.appendChild(row);
    loadStars(m.id);

    const opt = document.createElement("option");
    opt.value = m.id;
    opt.textContent = m.display_name;
    memberSelect.appendChild(opt);
  });

  list.querySelectorAll("button[data-member]").forEach((btn) => {
    btn.onclick = () => giveStar(btn.getAttribute("data-member"));
  });
}

async function loadStars(memberId) {
  try {
    const data = await api("/api/stars?memberId=" + memberId);
    const el = $("stars-" + memberId);
    if (el) el.textContent = "⭐ " + data.balance;
  } catch (err) {
    // quietly ignore — star display just stays as "..."
  }
}

async function giveStar(memberId) {
  try {
    await api("/api/stars", {
      method: "POST",
      body: JSON.stringify({
        memberId,
        delta: 1,
        reason: "Given by a family member",
        idempotencyKey: crypto.randomUUID(),
      }),
    });
    await loadStars(memberId);
  } catch (err) {
    alert(err.message);
  }
}

// --- Members: add ---
$("showAddMemberBtn").onclick = () => show("addMemberForm");
$("addMemberBtn").onclick = async () => {
  clearError("memberError");
  try {
    await api("/api/members", {
      method: "POST",
      body: JSON.stringify({
        displayName: $("newMemberName").value,
        role: $("newMemberRole").value,
      }),
    });
    $("newMemberName").value = "";
    hide("addMemberForm");
    const me = await api("/api/me");
    state.members = me.members;
    renderMembers();
  } catch (err) {
    showError("memberError", err.message);
  }
};

// --- Events ---
async function renderEvents() {
  const data = await api("/api/events");
  const list = $("eventsList");
  list.innerHTML = "";
  if (!data.events.length) {
    list.innerHTML = '<p class="muted">No events yet — add your family\'s first one below!</p>';
    return;
  }
  data.events.forEach((e) => {
    const when = new Date(e.starts_at).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    const row = document.createElement("div");
    row.className = "event-row";
    row.innerHTML = `<strong>${e.title}</strong>${e.pillar ? '<span class="pill">' + e.pillar + '</span>' : ''}<div class="muted">${when}</div>`;
    list.appendChild(row);
  });
}

$("showAddEventBtn").onclick = () => show("addEventForm");
$("addEventBtn").onclick = async () => {
  clearError("eventError");
  const startVal = $("newEventStart").value;
  if (!startVal) { showError("eventError", "Please pick a date and time."); return; }
  try {
    await api("/api/events", {
      method: "POST",
      body: JSON.stringify({
        title: $("newEventTitle").value,
        memberId: $("newEventMember").value || null,
        pillar: $("newEventPillar").value || null,
        startsAt: new Date(startVal).toISOString(),
      }),
    });
    $("newEventTitle").value = "";
    hide("addEventForm");
    await renderEvents();
  } catch (err) {
    showError("eventError", err.message);
  }
};

// --- Boot ---
(async function boot() {
  if (state.token) {
    try {
      await loadHome();
      return;
    } catch (err) {
      localStorage.removeItem("ftf_token");
      state.token = null;
    }
  }
  show("authScreen");
})();
</script>
</body>
</html>
