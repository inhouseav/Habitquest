<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fuel the Fun</title>
<style>
  :root {
    --bg: #FAF6ED;
    --card: #FFFDF8;
    --text: #183F35;
    --sage: #E4EAD9;
    --terracotta: #BE7050;
    --peach: #F8E3D1;
    --blue: #E2ECEE;
    --gold: #F8E8C7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  main {
    background: var(--card);
    border-radius: 24px;
    padding: 40px 32px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 2px 16px rgba(24, 63, 53, 0.08);
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 2rem;
    margin: 0 0 8px;
  }
  p {
    margin: 0 0 24px;
    line-height: 1.5;
  }
  .status {
    display: inline-block;
    background: var(--sage);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 0.9rem;
    margin-bottom: 8px;
  }
  .status.bad { background: var(--peach); }
  button {
    background: var(--terracotta);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 1rem;
    cursor: pointer;
  }
  #result { margin-top: 16px; font-size: 0.85rem; color: var(--text); opacity: 0.8; }
</style>
</head>
<body>
<main>
  <h1>Fuel the Fun 🌱</h1>
  <p>This is Session 1's real scaffold — a live Cloudflare Pages + Functions deployment, not a mockup. Everything else is tracked honestly in BUILD_STATUS.md.</p>
  <button onclick="checkHealth()">Check API connection</button>
  <div id="result"></div>
</main>
<script>
  async function checkHealth() {
    const el = document.getElementById('result');
    el.textContent = 'Checking…';
    try {
      const res = await fetch('/api/health');
      const data = await res.json();
      el.textContent = JSON.stringify(data, null, 2);
    } catch (err) {
      el.textContent = 'Could not reach API: ' + err.message;
    }
  }
</script>
</body>
</html>
