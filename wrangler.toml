# deploy a binding that points at a database/bucket that doesn't exist yet.
# Once these are really created (see README "Setup" steps), uncomment both
# blocks below, fill in the real database_id, and redeploy.
#
# [[d1_databases]]
# binding = "DB"
# database_name = "habitquest-db"
# database_id = "REPLACE_ME_AFTER_WRANGLER_D1_CREATE"
#
# [[r2_buckets]]
# binding = "PHOTOS"
# bucket_name = "habitquest-photos"
