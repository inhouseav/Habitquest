name = "habitquest"
compatibility_date = "2024-11-01"
main = "src/worker.js"

[assets]
directory = "public"
binding = "ASSETS"

# Real D1 database — created 2026-10-24 via the Cloudflare dashboard
# (Workers & Pages → habitquest → Settings → Bindings → Add binding).
[[d1_databases]]
binding = "DB"
database_name = "habitquest-db"
database_id = "2fa8326b-db8d-4a92-99c0-83a24b7d2a86"

# R2 bucket (family photos) — not created yet, so this stays commented out
